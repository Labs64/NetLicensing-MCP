[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "netlicensing-mcp"
dynamic = ["version"]
description = "Official Labs64 NetLicensing MCP server: manage products, licensees, licenses and entitlements in plain language, with secret redaction and confirmed deletes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "netlicensing",
    "labs64",
    "fastmcp",
    "licensing",
    "licensing-as-a-service",
    "software-licensing",
    "license-management",
    "license-validation",
    "entitlements",
    "saas",
    "ai-agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Customer Service",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "mcp[cli]>=1.21.1,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff",
    "mypy",
    "pip-audit",
]

[project.urls]
Homepage = "https://netlicensing.io"
Documentation = "https://netlicensing.io/wiki/"
Repository = "https://github.com/Labs64/NetLicensing-MCP"
Issues = "https://github.com/Labs64/NetLicensing-MCP/issues"
Changelog = "https://github.com/Labs64/NetLicensing-MCP/blob/master/CHANGELOG.md"
Security = "https://github.com/Labs64/NetLicensing-MCP/blob/master/SECURITY.md"

[project.scripts]
netlicensing-mcp = "netlicensing_mcp.server:main"

[tool.hatch.version]
source = "vcs"   # reads from git tag

[tool.hatch.build.targets.wheel]
packages = ["src/netlicensing_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/netlicensing_mcp --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/netlicensing_mcp"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
